[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
bEnableMouseSmoothing=False
; Pinned ON, as in Epic's template: IMC_OnFoot look mappings negate Y and rely on the
; PlayerController InputYawScale=2.5 / InputPitchScale=-2.5. Turning this off inverts pitch
; and changes look speed (Enhanced Input reads raw mouse deltas).
bEnableLegacyInputScales=True
