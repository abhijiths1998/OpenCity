; OpenCity scalability overrides (skeleton for M0, tuned and measured in M4).
; Levels: 0 = Low, 1 = Medium (the 60 FPS target), 2 = High, 3 = Ultra (engine "Epic").
; Only values that differ from Engine/Config/BaseScalability.ini are listed.
; All numbers are Targets from ARCHITECTURE.md section 8, not measurements.

[ScalabilitySettings]
; Render scale per ResolutionQuality level, upscaled to 1080p with TSR.
PerfIndexValues_ResolutionQuality="58 70 83 100 100"

; Texture pool (M4a), settled 2026-11-13 from the perf lap's streaming log (OCPerf: "streaming pool ... required ...
; max ever"): L_Marevia needs at most 212 MiB on Medium and 192 MiB on High (most surfaces are procedural
; over 1-2K CC0 sets). The pools are about 4x that, for traffic, people and weapons to come (M5-M8),
; and stay well inside this 6 GB card, where the desktop already holds ~1.7 GB (game VRAM ~4.0 GB on
; Medium). The old 1200-2800 MiB were ARCHITECTURE.md targets, never measured.
[TextureQuality@0]
r.Streaming.PoolSize=600

[TextureQuality@1]
r.Streaming.PoolSize=800

[TextureQuality@2]
r.Streaming.PoolSize=1000

[TextureQuality@3]
r.Streaming.PoolSize=1200

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.8

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.2

[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[FoliageQuality@1]
foliage.DensityScale=0.7
grass.DensityScale=0.7

; Volumetric clouds (measured 2026-11-07, daylight, packaged Development, Medium, empty level):
;   full 13.6 ms GPU, cheap settings 10.5 ms, off 7.7 ms -> clouds cost ~5.9 ms.
; 60 FPS wins: Low/Medium have no volumetric clouds (M4 adds a cheap painted cloud layer to the sky),
; High uses cheap clouds, Ultra full. Every level sets every value, so switching presets never
; leaves stale values behind.
[EffectsQuality@0]
r.VolumetricCloud=0

[EffectsQuality@1]
r.VolumetricCloud=0

[EffectsQuality@2]
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=48
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=8
r.VolumetricCloud.ReflectionRaySampleMaxCount=16
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=16
r.VolumetricCloud.SkyAO=0

[EffectsQuality@3]
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80
r.VolumetricCloud.ReflectionRaySampleMaxCount=80
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=128
r.VolumetricCloud.SkyAO=1

; GlobalIlluminationQuality@0: engine default disables Lumen (screen-space GI fallback) - keep.
; GlobalIlluminationQuality@1: engine default is "Lumen Lite", the irradiance-field final gather
;   (r.Lumen.FinalGatherMethod=0) - keep. Decided 2026-11-13 (M4a): Medium, L_Marevia perf lap, A/B/A
;   back to back: irradiance field 75.6 / 67.3 fps, GPU 12.5 / 14.0 ms; screen probe gather (=1) 55.8 fps,
;   GPU 17.3 ms. It runs on Linux Vulkan SM6 without problems; the look was approved on 11-09 with it.
; ShadowQuality: Medium VSM vs cascaded is decided by measurement in M4.

; Low: the engine's r.ShadowQuality=0 turns sun shadows off entirely, and streets read flat (QA
; 2026-11-09, preset comparison). Keep basic shadows; the rest of the engine Low values stay.
[ShadowQuality@0]
r.ShadowQuality=2

; High (preset 2) in L_Marevia, measured 2026-11-09 18:05-18:30, editor -game, one perf lap each,
; back to back, browsers open (whole GPU 5.8 of 6.1 GB):
;   baseline (first)              53.0 fps, render 10.2 ms, GPU 18.0 ms
;   + r.DistanceFieldShadowing 0  54.2 fps, render 15.8 ms, GPU 17.7 ms
;   + r.Lumen.TraceMeshSDFs 0     50.5 fps, render 11.7 ms, GPU 18.9 ms
;   + r.VolumetricFog 0           40.0 fps, render 26.3 ms, GPU 19.8 ms
;   baseline (last)               28.1 fps, render 34.6 ms, GPU 34.8 ms
; The same preset fell from 53 to 28 fps over the batch (CPU at 78 C, clock capped), so no single
; cvar beat the noise and High keeps the engine values. The earlier "High at 18.8 fps" was a run on
; a hot machine, not a High setting. Compare High only with a cool machine and interleaved runs.
