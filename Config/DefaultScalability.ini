; OpenCity scalability overrides (skeleton for M0, tuned and measured in M4).
; Levels: 0 = Low, 1 = Medium (the 60 FPS target), 2 = High, 3 = Ultra (engine "Epic").
; Only values that differ from Engine/Config/BaseScalability.ini are listed.
; All numbers are Targets from ARCHITECTURE.md section 8, not measurements.

[ScalabilitySettings]
; Render scale per ResolutionQuality level, upscaled to 1080p with TSR.
PerfIndexValues_ResolutionQuality="58 70 83 100 100"

[TextureQuality@0]
r.Streaming.PoolSize=1200

[TextureQuality@1]
r.Streaming.PoolSize=2000

[TextureQuality@2]
r.Streaming.PoolSize=2400

[TextureQuality@3]
r.Streaming.PoolSize=2800

[ViewDistanceQuality@0]
r.ViewDistanceScale=0.6

[ViewDistanceQuality@1]
r.ViewDistanceScale=0.8

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.2

[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4

[FoliageQuality@1]
foliage.DensityScale=0.7
grass.DensityScale=0.7

; Volumetric clouds (measured 2026-11-07, daylight, packaged Development, Medium, empty level):
;   full 13.6 ms GPU, cheap settings 10.5 ms, off 7.7 ms -> clouds cost ~5.9 ms.
; 60 FPS wins: Low/Medium have no volumetric clouds (M4 adds a cheap painted cloud layer to the sky),
; High uses cheap clouds, Ultra full. Every level sets every value, so switching presets never
; leaves stale values behind.
[EffectsQuality@0]
r.VolumetricCloud=0

[EffectsQuality@1]
r.VolumetricCloud=0

[EffectsQuality@2]
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=48
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=8
r.VolumetricCloud.ReflectionRaySampleMaxCount=16
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=16
r.VolumetricCloud.SkyAO=0

[EffectsQuality@3]
r.VolumetricCloud=1
r.VolumetricCloud.ViewRaySampleMaxCount=768
r.VolumetricCloud.Shadow.ViewRaySampleMaxCount=80
r.VolumetricCloud.ReflectionRaySampleMaxCount=80
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=128
r.VolumetricCloud.SkyAO=1

; GlobalIlluminationQuality@0: engine default disables Lumen (screen-space GI fallback) - keep.
; GlobalIlluminationQuality@1: engine default is the fast Lumen irradiance-volume path - keep.
; ShadowQuality: Medium VSM vs cascaded is decided by measurement in M4.
